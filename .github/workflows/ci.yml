name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/cdk/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/cdk/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  infra-cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run synth
